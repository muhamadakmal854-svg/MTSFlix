name: 🌐 Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'check.html'
      - 'licenses.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Bina folder awam (_site)
        run: |
          mkdir -p _site
          # check.html jadi index.html utama (portal semak lesen awam)
          cp check.html _site/index.html
          # licenses.json untuk fallback direct fetch
          cp licenses.json _site/licenses.json
          echo "✅ Fail awam disediakan:"
          ls -la _site/

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
